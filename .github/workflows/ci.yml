name: TaskPortal CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/next/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # 1. Backend Build and Validation
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Generate Prisma Client
      run: |
        cd backend
        npx prisma generate

    - name: Build Backend
      run: |
        cd backend
        npm run build --if-present

    # 2. Frontend Build and Validation
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Compile Frontend Bundle
      run: |
        cd frontend
        npm run build

    # 3. Save Production Artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build-assets
        path: |
          backend/dist
          frontend/dist
        retention-days: 7
